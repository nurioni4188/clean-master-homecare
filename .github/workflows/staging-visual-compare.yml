name: Clean Master original-vs-Staging desktop mobile snapshots
on:
  push:
    branches:
      - feature/integrated-v26-designlocked-staging-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: preview/integrated-v26-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned build and browser test tools (no scripts/secrets)
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Install isolated Chromium for CI (no real customer session)
        run: npx playwright install --with-deps chromium
      - name: Build local Staging candidate
        run: npm run build
      - name: Render 2번 original and derivative at desktop and mobile sizes
        run: node tests/visual-compare.mjs
      - name: Save snapshots and computed-style report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-master-v26-design-compare
          path: preview/integrated-v26-staging/visual-outputs/
          if-no-files-found: warn
          retention-days: 7
